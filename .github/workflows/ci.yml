name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Playwright visual regression screenshots (chromium only)'
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  ci:
    name: Typecheck → Test → Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: workmanagement
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d workmanagement"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with Postgres)
        run: pnpm test
        env:
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement

      - name: Integration tests (real Postgres — WM-002)
        run: pnpm db:migrate && pnpm --filter @workmanagement/web test:integration
        env:
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement

      - name: Lint
        run: pnpm lint

  security:
    name: Security (secrets + deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks — scans full git history)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No pnpm cache here: this job runs `pnpm audit` (reads the lockfile
          # only) and never installs, so there is no pnpm store to cache — and
          # the cache-save post-step would fail on the missing path.

      - name: Dependency vulnerability audit (fail on high/critical)
        run: pnpm audit --audit-level high

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # 15 min was too tight for slow shared runners — the Playwright suite runs
    # ~9–15 min per browser, so busy runners intermittently tripped the timeout
    # and cancelled a browser job (surfacing as a spurious "E2E (…)" failure that
    # blocked otherwise-green PRs). Give headroom (the sibling e2e.yml uses 45).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
            install: chromium
          - browser: firefox
            project: firefox
            install: firefox
          - browser: mobile-chrome
            project: Mobile Chrome
            install: chromium
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: workmanagement
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d workmanagement"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the browser binaries so the slow `playwright install --with-deps`
      # (an apt step that was re-running on every job and intermittently hanging
      # past the job timeout) only runs on a cache miss. Uses the same key as the
      # sibling e2e.yml, so this job hits an already-warm cache. The key includes
      # matrix.install so a chromium cache doesn't wrongly satisfy the firefox job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.install }}-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/package.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workmanagement/web exec playwright install --with-deps ${{ matrix.install }}

      - name: Run E2E tests
        if: github.event.inputs.update_snapshots != 'true' || matrix.browser == 'chromium'
        run: >
          pnpm --filter @workmanagement/web exec playwright test
          --project="${{ matrix.project }}"
          --reporter=list
          ${{ github.event.inputs.update_snapshots == 'true' && '--update-snapshots' || '' }}
        env:
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement
          CI_SKIP_DOCKER_SETUP: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload updated screenshots
        if: always() && github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-screenshots-chromium-linux
          path: |
            apps/web/__tests__/e2e/task-dependency-graph.spec.ts-snapshots/
            apps/web/__tests__/e2e/visual-email-preview-snapshots.spec.ts-snapshots/
          retention-days: 7
