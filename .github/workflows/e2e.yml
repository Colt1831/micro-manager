name: E2E Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - Mobile Chrome
        include:
          - project: chromium
            install: chromium
          - project: firefox
            install: firefox
          - project: Mobile Chrome
            install: chromium

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: workmanagement
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d workmanagement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement

      - name: Database seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement

      # NOTE: The cache key must include the browser being installed — a
      # shared key across the matrix meant a chromium-populated cache satisfied
      # the firefox job's cache-hit check, skipping `playwright install firefox`
      # and failing every firefox test with "Executable doesn't exist".
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.install }}-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/package.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workmanagement/web exec playwright install --with-deps ${{ matrix.install }}

      - name: Run E2E tests (${{ matrix.project }})
        run: pnpm --filter @workmanagement/web exec playwright test --project='${{ matrix.project }}' --reporter=list
        env:
          CI: true
          DATABASE_URL: postgres://dev:devpassword@localhost:5432/workmanagement
          CI_SKIP_DOCKER_SETUP: 'true'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7
